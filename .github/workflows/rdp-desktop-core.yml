name: RDP desktop core

on:
  pull_request:
    paths:
      - 'fixtures/**'
      - 'sdk-provenance.json'
      - 'src-tauri/page-core/**'
      - 'src-tauri/js-value-core/**'
      - 'itabby-plugin/src/rust/**'
      - 'scripts/reference-source.mjs'
      - 'src-tauri/rdp-desktop-core/**'
      - 'src-tauri/rdp-identity-core/**'
      - 'src-tauri/page-core/**'
      - 'src-tauri/js-value-core/**'
      - 'itabby-plugin/src/rust/value.ts'
      - 'rdp-plugin/src/desktops.ts'
      - 'rdp-plugin/src/clipboard.ts'
      - 'rdp-plugin/src/wake.ts'
      - 'rdp-plugin/src/hyperv.ts'
      - 'rdp-plugin/src/osd.ts'
      - 'rdp-plugin/src/desktopPolicy.ts'
      - 'rdp-plugin/src/rust/core.ts'
      - 'rdp-plugin/src/rust/value.ts'
      - 'rdp-plugin/src/rust/rdp-desktop.data.ts'
      - 'rdp-plugin/src/rust/rdp-identity.data.ts'
      - 'itabby-plugin/src/rust/core.ts'
      - 'scripts/rdp-desktop-core.check.mjs'
      - 'scripts/rdp-desktop-checks.mjs'
      - 'scripts/rust-page.check.mjs'
      - 'scripts/rust-page.mjs'
      - 'scripts/rust-page-options.mjs'
      - 'scripts/build.mjs'
      - 'rust-toolchain.toml'
      - '.github/actions/rust-setup/**'
      - '.github/workflows/rdp-desktop-core.yml'
  push:
    branches: [main]
    paths:
      - 'fixtures/**'
      - 'sdk-provenance.json'
      - 'src-tauri/page-core/**'
      - 'src-tauri/js-value-core/**'
      - 'itabby-plugin/src/rust/**'
      - 'scripts/reference-source.mjs'
      - 'src-tauri/rdp-desktop-core/**'
      - 'src-tauri/rdp-identity-core/**'
      - 'src-tauri/page-core/**'
      - 'src-tauri/js-value-core/**'
      - 'itabby-plugin/src/rust/value.ts'
      - 'rdp-plugin/src/desktops.ts'
      - 'rdp-plugin/src/clipboard.ts'
      - 'rdp-plugin/src/wake.ts'
      - 'rdp-plugin/src/hyperv.ts'
      - 'rdp-plugin/src/osd.ts'
      - 'rdp-plugin/src/desktopPolicy.ts'
      - 'rdp-plugin/src/rust/core.ts'
      - 'rdp-plugin/src/rust/value.ts'
      - 'rdp-plugin/src/rust/rdp-desktop.data.ts'
      - 'rdp-plugin/src/rust/rdp-identity.data.ts'
      - 'itabby-plugin/src/rust/core.ts'
      - 'scripts/rdp-desktop-core.check.mjs'
      - 'scripts/rdp-desktop-checks.mjs'
      - 'scripts/rust-page.check.mjs'
      - 'scripts/rust-page.mjs'
      - 'scripts/rust-page-options.mjs'
      - 'scripts/build.mjs'
      - 'rust-toolchain.toml'
      - '.github/actions/rust-setup/**'
      - '.github/workflows/rdp-desktop-core.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdp-desktop-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        if: runner.os == 'Linux'
      - run: rustup show active-toolchain
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check --manifest-path src-tauri/rdp-desktop-core/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/rdp-desktop-core/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/rdp-desktop-core/Cargo.toml --all-targets -- -D warnings

  page:
    name: WebAssembly and TypeScript parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: rustup target add wasm32-unknown-unknown
      - name: Build the required page modules and reuse their caches
        env:
          CARGO_TARGET_DIR: target/rdp-desktop-page
        run: |
          node scripts/rust-page.mjs target --module rdp-desktop --module rdp-identity
          node scripts/rust-page.mjs target --module rdp-desktop --module rdp-identity
      - run: node scripts/rust-page.check.mjs target/rdp-desktop.data.ts
      - run: node scripts/rdp-desktop-core.check.mjs target/rdp-desktop.data.ts target/rdp-identity.data.ts

  fuzz:
    name: RDP desktop policy fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          fuzz: 'true'
      - name: Build the request target
        env:
          CC: gcc
          CFLAGS: -fsanitize=address -fno-omit-frame-pointer
        run: cargo +nightly-2026-10-25 fuzz build --fuzz-dir src-tauri/rdp-desktop-core/fuzz desktop
      - name: Run the bounded campaign
        run: |
          mkdir -p /tmp/rdp-desktop-corpus /tmp/rdp-desktop-artifacts
          python3 src-tauri/rdp-desktop-core/fuzz/seed.py /tmp/rdp-desktop-corpus
          src-tauri/rdp-desktop-core/fuzz/target/$PADDY_RUST_HOST/release/desktop /tmp/rdp-desktop-corpus -max_total_time=60 -max_len=8388609 -rss_limit_mb=2048 -timeout=15 -artifact_prefix=/tmp/rdp-desktop-artifacts/
      - name: Retain crash inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rdp-desktop-fuzz-artifacts
          path: /tmp/rdp-desktop-artifacts
          if-no-files-found: ignore
