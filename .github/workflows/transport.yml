name: Native RDP transport
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: transport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --locked --manifest-path src-tauri/rdp-native/Cargo.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/check-rdp-assets.mjs
      - run: node scripts/check-sdk.mjs
