name: RDP file core

on:
  pull_request:
    paths:
      - 'fixtures/**'
      - 'sdk-provenance.json'
      - 'src-tauri/page-core/**'
      - 'src-tauri/js-value-core/**'
      - 'itabby-plugin/src/rust/**'
      - 'scripts/reference-source.mjs'
      - 'src-tauri/rdp-file-core/**'
      - 'src-tauri/rdp-native/**'
      - 'rdp-plugin/src/rdpFile.ts'
      - 'rdp-plugin/src/desktop.service.ts'
      - 'scripts/rdp-file-checks.mjs'
      - 'scripts/rdp-file-core.check.mjs'
      - 'rust-toolchain.toml'
      - '.github/actions/rust-setup/**'
      - '.github/workflows/rdp-file-core.yml'
  push:
    branches: [main]
    paths:
      - 'fixtures/**'
      - 'sdk-provenance.json'
      - 'src-tauri/page-core/**'
      - 'src-tauri/js-value-core/**'
      - 'itabby-plugin/src/rust/**'
      - 'scripts/reference-source.mjs'
      - 'src-tauri/rdp-file-core/**'
      - 'src-tauri/rdp-native/**'
      - 'rdp-plugin/src/rdpFile.ts'
      - 'rdp-plugin/src/desktop.service.ts'
      - 'scripts/rdp-file-checks.mjs'
      - 'scripts/rdp-file-core.check.mjs'
      - 'rust-toolchain.toml'
      - '.github/actions/rust-setup/**'
      - '.github/workflows/rdp-file-core.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdp-file-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        if: runner.os == 'Linux'
      - run: rustup show active-toolchain
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check --manifest-path src-tauri/rdp-file-core/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/rdp-file-core/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/rdp-file-core/Cargo.toml --all-targets -- -D warnings

  parity:
    name: Native and TypeScript parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: cargo build --release --locked --manifest-path src-tauri/rdp-file-core/Cargo.toml --example parse
      - run: node scripts/rdp-file-core.check.mjs src-tauri/rdp-file-core/target/release/examples/parse

  fuzz:
    name: RDP file fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          fuzz: 'true'
      - name: Build the request target
        env:
          CC: gcc
          CFLAGS: -fsanitize=address -fno-omit-frame-pointer
        run: cargo +nightly-2026-10-25 fuzz build --fuzz-dir src-tauri/rdp-file-core/fuzz rdp_file
      - name: Run the bounded campaign
        run: |
          mkdir -p /tmp/rdp-file-corpus /tmp/rdp-file-artifacts
          python3 src-tauri/rdp-file-core/fuzz/seed.py /tmp/rdp-file-corpus
          src-tauri/rdp-file-core/fuzz/target/$PADDY_RUST_HOST/release/rdp_file /tmp/rdp-file-corpus -max_total_time=60 -max_len=1048577 -rss_limit_mb=2048 -timeout=15 -artifact_prefix=/tmp/rdp-file-artifacts/
      - name: Retain crash inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rdp-file-fuzz-artifacts
          path: /tmp/rdp-file-artifacts
          if-no-files-found: ignore
