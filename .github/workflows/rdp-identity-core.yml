name: RDP identity core

on:
  pull_request:
    paths:
      - 'fixtures/**'
      - 'sdk-provenance.json'
      - 'src-tauri/page-core/**'
      - 'src-tauri/js-value-core/**'
      - 'itabby-plugin/src/rust/**'
      - 'scripts/reference-source.mjs'
      - 'src-tauri/rdp-identity-core/**'
      - 'src-tauri/rdp-desktop-core/**'
      - 'rdp-plugin/src/desktopPolicy.ts'
      - 'src-tauri/page-core/**'
      - 'src-tauri/js-value-core/**'
      - 'itabby-plugin/src/rust/value.ts'
      - 'rdp-plugin/src/desktops.ts'
      - 'rdp-plugin/src/accounts.ts'
      - 'rdp-plugin/src/identity.ts'
      - 'rdp-plugin/src/rust/core.ts'
      - 'rdp-plugin/src/rust/value.ts'
      - 'rdp-plugin/src/rust/rdp-identity.data.ts'
      - 'rdp-plugin/src/rust/rdp-desktop.data.ts'
      - 'itabby-plugin/src/rust/core.ts'
      - 'scripts/rdp-identity-core.check.mjs'
      - 'scripts/rdp-identity-checks.mjs'
      - 'scripts/rust-page.check.mjs'
      - 'scripts/rust-page.mjs'
      - 'scripts/rust-page-options.mjs'
      - 'scripts/build.mjs'
      - 'rust-toolchain.toml'
      - '.github/actions/rust-setup/**'
      - '.github/workflows/rdp-identity-core.yml'
  push:
    branches: [main]
    paths:
      - 'fixtures/**'
      - 'sdk-provenance.json'
      - 'src-tauri/page-core/**'
      - 'src-tauri/js-value-core/**'
      - 'itabby-plugin/src/rust/**'
      - 'scripts/reference-source.mjs'
      - 'src-tauri/rdp-identity-core/**'
      - 'src-tauri/rdp-desktop-core/**'
      - 'rdp-plugin/src/desktopPolicy.ts'
      - 'src-tauri/page-core/**'
      - 'src-tauri/js-value-core/**'
      - 'itabby-plugin/src/rust/value.ts'
      - 'rdp-plugin/src/desktops.ts'
      - 'rdp-plugin/src/accounts.ts'
      - 'rdp-plugin/src/identity.ts'
      - 'rdp-plugin/src/rust/core.ts'
      - 'rdp-plugin/src/rust/value.ts'
      - 'rdp-plugin/src/rust/rdp-identity.data.ts'
      - 'rdp-plugin/src/rust/rdp-desktop.data.ts'
      - 'itabby-plugin/src/rust/core.ts'
      - 'scripts/rdp-identity-core.check.mjs'
      - 'scripts/rdp-identity-checks.mjs'
      - 'scripts/rust-page.check.mjs'
      - 'scripts/rust-page.mjs'
      - 'scripts/rust-page-options.mjs'
      - 'scripts/build.mjs'
      - 'rust-toolchain.toml'
      - '.github/actions/rust-setup/**'
      - '.github/workflows/rdp-identity-core.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdp-identity-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        if: runner.os == 'Linux'
      - run: rustup show active-toolchain
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check --manifest-path src-tauri/rdp-identity-core/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/rdp-identity-core/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/rdp-identity-core/Cargo.toml --all-targets -- -D warnings

  page:
    name: WebAssembly and TypeScript parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: rustup target add wasm32-unknown-unknown
      - name: Build the page module
        env:
          RUSTFLAGS: '-C link-arg=--max-memory=134217728'
        run: |
          CARGO_TARGET_DIR=target/rdp-identity-page/rdp-desktop cargo build --release --locked --target wasm32-unknown-unknown --manifest-path src-tauri/rdp-desktop-core/Cargo.toml
          CARGO_TARGET_DIR=target/rdp-identity-page/rdp-identity cargo build --release --locked --target wasm32-unknown-unknown --manifest-path src-tauri/rdp-identity-core/Cargo.toml
          node --input-type=module -e 'import fs from "node:fs"; for(const name of ["rdp-identity","rdp-desktop"]){ const bytes=fs.readFileSync("target/rdp-identity-page/"+name+"/wasm32-unknown-unknown/release/paddy_"+name.replaceAll("-","_")+"_core.wasm"); fs.writeFileSync("target/"+name+".data.ts", "export const WASM = "+JSON.stringify(bytes.toString("base64"))+"\n") }'
      - run: node scripts/rust-page.check.mjs target/rdp-identity.data.ts
      - run: node scripts/rdp-identity-core.check.mjs target/rdp-identity.data.ts

  fuzz:
    name: RDP identity request fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          fuzz: 'true'
      - name: Build the request target
        env:
          CC: gcc
          CFLAGS: -fsanitize=address -fno-omit-frame-pointer
        run: cargo +nightly-2026-10-25 fuzz build --fuzz-dir src-tauri/rdp-identity-core/fuzz identity
      - name: Run the bounded campaign
        run: |
          mkdir -p /tmp/rdp-identity-corpus /tmp/rdp-identity-artifacts
          python3 src-tauri/rdp-identity-core/fuzz/seed.py /tmp/rdp-identity-corpus
          src-tauri/rdp-identity-core/fuzz/target/$PADDY_RUST_HOST/release/identity /tmp/rdp-identity-corpus -max_total_time=60 -max_len=8388609 -rss_limit_mb=2048 -timeout=15 -artifact_prefix=/tmp/rdp-identity-artifacts/
      - name: Retain crash inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rdp-identity-fuzz-artifacts
          path: /tmp/rdp-identity-artifacts
          if-no-files-found: ignore
